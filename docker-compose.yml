services:
  fastapi-be:
    container_name: 'fastapi-be'
    build:
      context: fastapi_be/
      dockerfile: Dockerfile
    environment:
      PRODUCTION: "false"
      DATABASE_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/?authSource=${MONGO_USER} 
      MONGO_USER: ${MONGO_USER}  
      MONGO_PASS: ${MONGO_PASS} 
      DB_NAME: ${DB_NAME} 
    ports:
      - 8002:8002
    depends_on:
      - mongo
    networks:
      - my-local
  reactapp-fe:
    container_name: 'reactapp-fe'
    build:
      context: react_fe/
      dockerfile: Dockerfile
    environment:
      PRODUCTION: "false"
    ports:
      - 5173:5173
    depends_on:
      - mongo
    networks:
      - my-local
  mongo:
    container_name: mongo
    image: mongo
    restart: always
    volumes:
      - ./fastapi_be/db-data:/data/db
      - ./fastapi_be/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER} 
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS} 
      MONGO_INITDB_DATABASE: ${DB_NAME} 
    ports:
      - 27017:27017
    networks:
      - my-local
networks:
  my-local:
    driver: bridge
