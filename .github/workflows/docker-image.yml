name: Build and Push Docker Image to Docker Hub

on:
  pull_request:
    types:
      - closed
    branches:
      - main

#Allow repo secrets

jobs:
    if_merged:
      if: github.event.pull_request.merged == true
      runs-on: ubuntu-latest
      steps:
        - name: checkout repository
          uses: actions/checkout@v4
          with:
            ref: 'main'

        - name: login to docker registry
          uses: docker/login-action@v3
          with:
            username: ${{secrets.DOCKERHUB_USERNAME}}
            password: ${{secrets.DOCKERHUB_TOKEN}}

        - name: build and push FastAPI backend docker image to registry
          uses: docker/build-push-action@v5
          with:
            context: fastapi_be/
            push: true
            tags: |
              ${{secrets.DOCKERHUB_USERNAME}}/fastapi_be:${{github.sha}}
              ${{secrets.DOCKERHUB_USERNAME}}/fastapi_be:latest
            
        - name: build and push react frontend docker image to registry
          run: cp react_fe/.env.sample react_fe/.env
        - name: build react_fe docker image
          run: sudo docker build -t react_fe:${{github.sha}} -f react_fe/Dockerfile react_fe
        - name: tag image
          run: |
            docker tag react_fe:${{github.sha}} ${{secrets.DOCKERHUB_USERNAME}}/react_fe:${{github.sha}}
            docker tag react_fe:${{github.sha}} ${{secrets.DOCKERHUB_USERNAME}}/react_fe:latest
        - name: Docker push
          run: |
            docker push ${{secrets.DOCKERHUB_USERNAME}}/react_fe:${{github.sha}}
            docker push ${{secrets.DOCKERHUB_USERNAME}}/react_fe:latest

 
              ${{secrets.DOCKERHUB_USERNAME}}/rair-sync:${{github.sha}}
              ${{secrets.DOCKERHUB_USERNAME}}/rair-sync:latest
